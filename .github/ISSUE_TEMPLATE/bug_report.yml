name: Bug 报告
description: 报告可重复的功能或界面问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传真实 `.subject-sort` 项目、私人数据、令牌或未公开的安全漏洞。安全问题请使用 Security 页面的私密漏洞报告。
  - type: input
    id: app-version
    attributes:
      label: 应用版本
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      description: 请使用虚构或脱敏数据描述最小重现过程。
      placeholder: |
        1. 打开……
        2. 选择……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认提交内容不含真实项目、私人数据、访问令牌或未公开漏洞细节。
          required: true
